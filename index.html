<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Alaiza Nicole Caranto — Web Developer & Network Administrator. Portfolio of projects, tech stack, and contact." />
    <meta name="author" content="Alaiza Nicole Caranto" />
    <title>Alaiza Nicole Caranto | Web Developer &amp; Network Administrator</title>

    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet" />

    <!-- Bootstrap provides the responsive grid and utilities. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Devicon: tech logos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />

    <!-- Stylesheets (from general to specific) -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/component.css" />
    <link rel="stylesheet" href="css/animation.css" />
</head>

<body>
    <!-- Show a loading screen while page sections are fetched. -->
    <div id="loader" class="loader-screen">
        <div class="loader-content">
            <span class="loader-bracket">&lt;</span>
            <span class="loader-text">ANC</span>
            <span class="loader-bracket">/&gt;</span>
            <div class="loader-bar"><span></span></div>
        </div>
    </div>

    <div class="scroll-progress" role="progressbar" aria-label="Page scroll progress" aria-valuemin="0"
        aria-valuemax="100" aria-valuenow="0">
        <span id="scrollProgressBar"></span>
    </div>

    <!-- js/loader.js fetches the section markup into these placeholders. -->
    <div id="app">
        <div data-section="navbar"></div>
        <main>
            <div data-section="hero"></div>
            <div data-section="about"></div>
            <div data-section="tech"></div>
            <div data-section="network-lab"></div>
            <div data-section="projects"></div>
            <div data-section="contact"></div>
        </main>
        <div data-section="footer"></div>
    </div>

    <!-- Return to the top of the page. -->
    <button id="backToTop" class="back-to-top" aria-label="Back to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path
                d="M8 3.5a.5.5 0 0 1 .5.5v7.793l3.146-3.147a.5.5 0 1 1 .708.708l-4 4a.5.5 0 0 1-.708 0l-4-4a.5.5 0 1 1 .708-.708L7.5 11.793V4a.5.5 0 0 1 .5-.5z" />
        </svg>
    </button>

    <!-- Load dependencies before the scripts that use them. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/tech-stack.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
